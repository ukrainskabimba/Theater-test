<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Dramatica | Оплата</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
</head>
<body class="payment-page-body">
    <div class="payment-container">
        <h2 style="font-family: 'Playfair Display', serif; color: var(--gold); text-align: center; margin-bottom: 30px; font-size: 32px;">Оформлення замовлення</h2>
        <form class="payment-form" id="payment-form">
            <label>Ім'я та Прізвище</label>
            <input type="text" placeholder="Введіть ваше ім'я" required>
            <label>Електронна пошта</label>
            <input type="email" placeholder="example@mail.com" required>
            <label>Номер картки</label>
            <input type="text" id="card-number" placeholder="0000 0000 0000 0000" maxlength="16" required>
            <div class="cvv-row">
                <div>
                    <label>Термін дії</label>
                    <input type="text" placeholder="MM/YY" maxlength="5" required>
                </div>
                <div>
                    <label>CVV</label>
                    <input type="text" id="cvv-code" placeholder="***" maxlength="3" required>
                </div>
            </div>
            <button type="submit" id="pay-btn" class="cta-button" style="width: 100%;">Оплатити квиток</button>
            <div id="status-message"></div>
            <button id="back-to-hall-btn" class="success-button" type="button">Добре</button>
        </form>
    </div>
    <script>
        const cardInput = document.getElementById('card-number');
        const cvvInput = document.getElementById('cvv-code');
        const form = document.getElementById('payment-form');
        const statusMsg = document.getElementById('status-message');
        const payBtn = document.getElementById('pay-btn');
        const backBtn = document.getElementById('back-to-hall-btn');
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        const onlyNumbers = (e) => {
            e.target.value = e.target.value.replace(/\D/g, ''); 
        };
        cardInput.addEventListener('input', onlyNumbers);
        cvvInput.addEventListener('input', onlyNumbers);
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            statusMsg.innerText = "";
            if (cardInput.value.length < 16) {
                statusMsg.innerText = "Номер картки має містити 16 цифр!";
                statusMsg.style.color = "#ff4d4d";
                return;
            }
            if (cvvInput.value.length < 3) {
                statusMsg.innerText = "CVV код має містити 3 цифри!";
                statusMsg.style.color = "#ff4d4d";
                return;
            }
            statusMsg.innerText = "Оплата пройшла успішно! Квиток надіслано на вашу пошту.";
            statusMsg.style.color = "#f0d98f";
            payBtn.style.display = "none";
            backBtn.style.display = "block";
        });
        backBtn.addEventListener('click', () => {
            if (!currentUser) {
                alert("Помилка: користувач не знайдений.");
                window.location.href = 'account.html';
                return;
            }
            let myTickets = JSON.parse(localStorage.getItem('userTickets')) || [];
            const seatIds = JSON.parse(localStorage.getItem('lastBoughtSeatId')) || [];
            const seatTexts = JSON.parse(localStorage.getItem('lastBoughtText')) || [];
            const perf = localStorage.getItem('lastBoughtPerformance');
            const totalPrice = localStorage.getItem('lastBoughtPrice');
            const singlePrice = seatIds.length > 0 ? Math.round(totalPrice / seatIds.length) : 0;
            seatIds.forEach((id, index) => {
                const currentSeatInfo = seatTexts[index] || "Обране місце";
                const newTicket = {
                    id: Math.floor(Math.random() * 1000000),
                    ownerEmail: currentUser.email,
                    perf: perf,
                    seat: currentSeatInfo,
                    seatId: id,
                    date: new Date().toLocaleDateString('uk-UA'),
                    price: singlePrice
                };
                myTickets.push(newTicket);
            });
            localStorage.setItem('userTickets', JSON.stringify(myTickets));
            window.location.href = 'account.html';
        });
    </script>
</body>
</html>
