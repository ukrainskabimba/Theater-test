<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Dramatica | Оплата</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
</head>
<body class="payment-page-body">
    <div class="payment-container">
        <h2 style="font-family: 'Playfair Display', serif; color: var(--gold); text-align: center; margin-bottom: 30px; font-size: 32px;">Оформлення замовлення</h2>
        <form class="payment-form" id="payment-form">
            <label>Ім'я та Прізвище</label>
            <input type="text" placeholder="Введіть ваше ім'я" required>
            <div id="email-group">
                <label>Електронна пошта</label>
                <input type="email" id="user-email" placeholder="example@mail.com" required>
            </div>
            <label>Номер картки</label>
            <input type="text" id="card-number" placeholder="0000 0000 0000 0000" maxlength="16" required>
            <div class="cvv-row">
                <div>
                    <label>Термін дії</label>
                    <input type="text" id="expiry-date" placeholder="MM/YY" maxlength="5" required>
                </div>
                <div>
                    <label>CVV</label>
                    <input type="text" id="cvv-code" placeholder="***" maxlength="3" required>
                </div>
            </div>
            <button type="submit" id="pay-btn" class="cta-button" style="width: 100%;">Оплатити квиток</button>
            <div id="status-message"></div>
            <button id="back-to-hall-btn" class="success-button" type="button">Добре</button>
        </form>
    </div>
    <script>
        // ===== ПОЛУЧЕНИЕ ЭЛЕМЕНТОВ ФОРМЫ =====
        const cardInput = document.getElementById('card-number');
        const cvvInput = document.getElementById('cvv-code');
        const form = document.getElementById('payment-form');
        const statusMsg = document.getElementById('status-message');
        const payBtn = document.getElementById('pay-btn');
        const backBtn = document.getElementById('back-to-hall-btn');
        const emailGroup = document.getElementById('email-group');
        const emailInput = document.getElementById('user-email');
        const expiryInput = document.getElementById('expiry-date');

        // ===== ПОЛУЧЕНИЕ ДАННЫХ ПОЛЬЗОВАТЕЛЯ ИЗ ЛОКАЛЬНОГО ХРАНИЛИЩА =====
        const currentUser = JSON.parse(localStorage.getItem('currentUser')); //объект, содержащий информацию залогированного пользователя

        // ===== СКРЫТИЕ EMAIL ПОЛЯ ДЛЯ АВТОРИЗОВАННЫХ ПОЛЬЗОВАТЕЛЕЙ =====
        if (currentUser) {
            emailGroup.style.display = 'none';
            emailInput.removeAttribute('required');
            emailInput.value = currentUser.email;
        } 
        
        // ===== ФИЛЬТРАЦИЯ ТОЛЬКО ЦИФР =====
        const onlyNumbers = (e) => {
            e.target.value = e.target.value.replace(/\D/g, ''); 
        };
        
         // Привязываем функцию фильтрации к полям карты и CVV
        cardInput.addEventListener('input', onlyNumbers);
        cvvInput.addEventListener('input', onlyNumbers);
        
         // ===== АВТОФОРМАТИРОВАНИЕ ПОЛЯ СРОКА ДЕЙСТВИЯ КАРТЫ =====
        expiryInput.addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, ''); //\D - регулярное выражение для "всё что не цифра", /g - глобально (все вхождения)
            
            if (value.length > 2) {
                value = value.substring(0, 2) + '/' + value.substring(2, 4);  // автоматически вставляем слеш после 2 символов
            }
            
            e.target.value = value;
        });

        // ===== ОБРАБОТЧИК ОТПРАВКИ ФОРМЫ =====
        form.addEventListener('submit', (e) => {
            e.preventDefault(); //предотвращаем стандартную отправку формы
            statusMsg.innerText = "";
    
            // Проверяем что введено ровно 16 цифр
            if (cardInput.value.length < 16) { 
                statusMsg.innerText = "Номер картки має містити 16 цифр!";
                statusMsg.style.color = "#ff4d4d";
                return;
            }

            // Проверяем что введено ровно 3 цифры
            if (cvvInput.value.length < 3) {
                statusMsg.innerText = "CVV код має містити 3 цифри!";
                statusMsg.style.color = "#ff4d4d";
                return;
            }
    
            // ===== УСПЕШНАЯ ОПЛАТА =====
            statusMsg.innerText = "Оплата пройшла успішно! Квиток надіслано на вашу пошту.";
            statusMsg.style.color = "#f0d98f";
            payBtn.style.display = "none";
            backBtn.style.display = "block";
        });

        // ===== ОБРАБОТЧИК КНОПКИ "ДОБРЕ" =====
        backBtn.addEventListener('click', () => {
            // Проверяем что пользователь залогирован
            if (!currentUser) {
                alert("Помилка: користувач не знайдений.");
                window.location.href = 'account.html';
                return;
            }
            
             // ===== ПОЛУЧЕНИЕ ДАННЫХ О КУПЛЕННЫХ МЕСТАХ =====
            let myTickets = JSON.parse(localStorage.getItem('userTickets')) || []; // Массив всех билетов пользователя
            const seatIds = JSON.parse(localStorage.getItem('lastBoughtSeatId')) || []; // ID каждого выбранного места
            const seatTexts = JSON.parse(localStorage.getItem('lastBoughtText')) || []; // Текстовое описание мест
            const perf = localStorage.getItem('lastBoughtPerformance'); // ID спектакля
            const totalPrice = localStorage.getItem('lastBoughtPrice'); // Общая сумма за все места
            
            // ===== РАСЧЕТ ЦЕНЫ ЗА ОДНО МЕСТО =====
            // это упрощенный расчет, если места имели разные цены, нужен иной подход!!!!
            const singlePrice = seatIds.length > 0 ? Math.round(totalPrice / seatIds.length) : 0;
            
            // ===== ЦИКЛ ДЛЯ СОЗДАНИЯ БИЛЕТА НА КАЖДОЕ МЕСТО =====
            //Для каждого выбранного места создаем отдельный объект билета, позволяет пользователю пересадить/передать билет конкретного места другому
            seatIds.forEach((id, index) => {
                const currentSeatInfo = seatTexts[index] || "Обране місце"; // Подставляем описание места или значение по умолчанию
                const newTicket = {
                    id: Math.floor(Math.random() * 1000000),
                    ownerEmail: currentUser.email,
                    perf: perf,
                    seat: currentSeatInfo,
                    seatId: id,
                    date: new Date().toLocaleDateString('uk-UA'),
                    price: singlePrice
                };
                myTickets.push(newTicket);
            });
            
            // Сохраняем обновленный массив билетов, чтобы они остались даже после перезагрузки страницы
            localStorage.setItem('userTickets', JSON.stringify(myTickets));
            
            // Отправляем пользователя обратно в его аккаунт, где он сможет увидеть купленные билеты
            window.location.href = 'account.html';
        });
    </script>
</body>
</html>
